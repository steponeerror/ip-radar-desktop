[package]
name = "tauri-app"
version = "0.1.0"
description = "IP Radar Desktop — Tauri 2 companion for ip-radar"
authors = ["steponeerror"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.6.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-store = "2.4.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
