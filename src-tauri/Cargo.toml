[package]
name = "tauri-app"
version = "0.1.0"
description = "IP Radar Desktop — Tauri 2 companion for ip-radar"
authors = ["steponeerror"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.6.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-store = "2.4.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2"
# 池化 http_get 直用 reqwest:版本对齐锁内 tauri core 已用的 0.13(不引第三份拷贝);
# default-features=false 防 native-tls/openssl 混入。0.13 无 0.12 的 rustls-tls 特性,
# 且其 rustls 特性是 aws-lc provider(会把 aws-lc-sys/cmake 拖进 mac/msvc 发布
# 工具链)——改用 tauri core 同款组合:rustls-no-provider + 自带 rustls(ring)。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tauri-utils = "2"
