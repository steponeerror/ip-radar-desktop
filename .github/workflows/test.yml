name: test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.scope.outputs.extension }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - run: node --test scripts/ci-scope.test.mjs
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs "$BASE_SHA" HEAD >> "$GITHUB_OUTPUT"

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension/dist/
          if-no-files-found: error

      - run: npm run build:firefox
        working-directory: extension
      - run: npm run lint:firefox
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-unsigned
          path: extension/IP.Radar.Firefox_*.zip
          if-no-files-found: error

  test:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Tauri Linux 编译依赖(webkit2gtk + tray 图标库)
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # 平台原生编译 + Rust 侧测试(含 Windows 覆盖配置完整性回归钉)
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Exercise the real bundle/sign/package path on macOS, including resource sealing.
      - if: runner.os == 'macOS'
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          bash scripts/test-macos-dmg-validation.sh
          npm run tauri build -- --bundles dmg
          bash scripts/verify-macos-dmg.sh src-tauri/target/release/bundle/dmg/*.dmg --require-layout
