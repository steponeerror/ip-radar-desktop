name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release versions
        run: bash scripts/check-tag-version.sh "${GITHUB_REF_NAME}"
      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || {
              echo "Refusing to modify an already published release" >&2
              exit 1
            }
          else
            flags=(--draft --verify-tag)
            [[ "$RELEASE_TAG" != *-* ]] || flags+=(--prerelease)
            gh release create "$RELEASE_TAG" --title "IP Radar $RELEASE_TAG" --notes-file .github/release-notes.md "${flags[@]}"
          fi

  build-extension:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - name: Package and attach Chrome extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          asset="$RUNNER_TEMP/IP.Radar.Chrome_${RELEASE_TAG}.zip"
          (cd extension/dist && zip -r "$asset" .)
          gh release upload "$RELEASE_TAG" "$asset" --clobber

  build-firefox-extension:
    permissions:
      contents: read
    timeout-minutes: 30
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build:firefox
        working-directory: extension
      - run: npm run lint:firefox
        working-directory: extension
      - name: Sign with AMO (unlisted)
        working-directory: extension
        timeout-minutes: 20
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Missing AMO_API_KEY / AMO_API_SECRET repo secrets (addons.mozilla.org JWT credentials)" >&2
            exit 1
          fi
          npx --no-install web-ext sign --source-dir dist-firefox --channel unlisted --timeout 300000 --approval-timeout 600000
          shopt -s nullglob
          xpis=(web-ext-artifacts/*.xpi)
          [ "${#xpis[@]}" -eq 1 ] || { echo "Expected exactly one signed xpi in web-ext-artifacts/, found ${#xpis[@]}" >&2; exit 1; }
          mv "${xpis[0]}" "IP.Radar.Firefox_${RELEASE_TAG}.xpi"
      - name: Generate Firefox update manifest from signed XPI
        working-directory: extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import zipfile,sys; print(zipfile.ZipFile(sys.argv[1]).read("manifest.json").decode())' "IP.Radar.Firefox_${RELEASE_TAG}.xpi" > signed-manifest.json
          node scripts/firefox-updates.mjs signed-manifest.json "IP.Radar.Firefox_${RELEASE_TAG}.xpi" "$RELEASE_TAG" firefox-updates.json
      - name: Preserve signed XPI for upload retries
        uses: actions/upload-artifact@v4
        with:
          name: firefox-signed-${{ github.ref_name }}
          path: |
            extension/IP.Radar.Firefox_${{ github.ref_name }}.xpi
            extension/firefox-updates.json
          if-no-files-found: error
          retention-days: 30

  publish-firefox-extension:
    needs: [prepare-release, build-firefox-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firefox-signed-${{ github.ref_name }}
          path: signed
      - name: Attach signed XPI to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || {
            echo "Refusing to modify a published release" >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" "signed/IP.Radar.Firefox_${RELEASE_TAG}.xpi" signed/firefox-updates.json --clobber

  # Platform builds upload independently to the prepared draft.
  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Version gate (tag ↔ tauri.conf.json)
        run: bash scripts/check-tag-version.sh "${GITHUB_REF_NAME}"
      - run: npm run tauri build -- --bundles dmg
        env:
          # Preserve Finder layout even though GitHub sets CI=true.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - name: Verify packaged macOS app before uploading
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || exit 1
          bash scripts/verify-macos-dmg.sh "${dmgs[0]}" --require-layout
      - name: Upload verified DMG to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            filename="$(basename "$dmg")"
            asset="$RUNNER_TEMP/${filename// /.}"
            cp "$dmg" "$asset"
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
  # Windows portable executable (no installer).
  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Attach portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          exes=(src-tauri/target/release/*.exe)
          [[ ${#exes[@]} -eq 1 ]] || { echo "Expected exactly one portable EXE" >&2; exit 1; }
          asset="IP.Radar.Desktop_${RELEASE_TAG}_portable_x64.exe"
          cp "${exes[0]}" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
