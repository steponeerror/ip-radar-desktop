name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # macOS 先行:负责创建 draft release + 上传 DMG(便携语义,挂载即用)
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "IP Radar Desktop ${{ github.ref_name }}"
          releaseDraft: true
          args: --bundles dmg
  # Windows 依赖 mac 先建好 release;只编裸 exe(免安装),不做 NSIS/MSI
  build-windows:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Attach portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls src-tauri/target/release/*.exe | grep -v '\.dll' | head -1)
          cp "$exe" "IP.Radar.Desktop_${{ github.ref_name }}_portable_x64.exe"
          gh release upload "${{ github.ref_name }}" "IP.Radar.Desktop_${{ github.ref_name }}_portable_x64.exe" --clobber
