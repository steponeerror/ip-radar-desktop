name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release versions
        run: bash scripts/check-tag-version.sh "${GITHUB_REF_NAME}"
      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || {
              echo "Refusing to modify an already published release" >&2
              exit 1
            }
          else
            flags=(--draft --verify-tag)
            [[ "$RELEASE_TAG" != *-* ]] || flags+=(--prerelease)
            gh release create "$RELEASE_TAG" --title "IP Radar $RELEASE_TAG" --notes-file .github/release-notes.md "${flags[@]}"
          fi

  build-extension:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - name: Package and attach Chrome extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          asset="$RUNNER_TEMP/IP.Radar.Chrome_${RELEASE_TAG}.zip"
          (cd extension/dist && zip -r "$asset" .)
          gh release upload "$RELEASE_TAG" "$asset" --clobber

  # Platform builds upload independently to the prepared draft.
  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Version gate (tag ↔ tauri.conf.json)
        run: bash scripts/check-tag-version.sh "${GITHUB_REF_NAME}"
      - run: npm run tauri build -- --bundles dmg
        env:
          # Preserve Finder layout even though GitHub sets CI=true.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - name: Verify packaged macOS app before uploading
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || exit 1
          bash scripts/verify-macos-dmg.sh "${dmgs[0]}" --require-layout
      - name: Upload verified DMG to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            filename="$(basename "$dmg")"
            asset="$RUNNER_TEMP/${filename// /.}"
            cp "$dmg" "$asset"
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
  # Windows portable executable (no installer).
  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Attach portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls src-tauri/target/release/*.exe | grep -v '\.dll' | head -1)
          cp "$exe" "IP.Radar.Desktop_${{ github.ref_name }}_portable_x64.exe"
          gh release upload "${{ github.ref_name }}" "IP.Radar.Desktop_${{ github.ref_name }}_portable_x64.exe" --clobber
