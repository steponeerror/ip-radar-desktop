name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # macOS 先行:负责创建 draft release + 上传 DMG(便携语义,挂载即用)
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Version gate (tag ↔ tauri.conf.json)
        run: bash scripts/check-tag-version.sh "${GITHUB_REF_NAME}"
      - run: npm run tauri build -- --bundles dmg
      - name: Verify packaged macOS app before uploading
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || exit 1
          bash scripts/verify-macos-dmg.sh "${dmgs[0]}"
      - name: Create draft release and upload verified DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft)
          [[ "$RELEASE_TAG" != *-* ]] || flags+=(--prerelease)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "IP Radar Desktop $RELEASE_TAG" "${flags[@]}"
          fi
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            filename="$(basename "$dmg")"
            asset="$RUNNER_TEMP/${filename// /.}"
            cp "$dmg" "$asset"
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
  # Windows 依赖 mac 先建好 release;只编裸 exe(免安装),不做 NSIS/MSI
  build-windows:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Attach portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls src-tauri/target/release/*.exe | grep -v '\.dll' | head -1)
          cp "$exe" "IP.Radar.Desktop_${{ github.ref_name }}_portable_x64.exe"
          gh release upload "${{ github.ref_name }}" "IP.Radar.Desktop_${{ github.ref_name }}_portable_x64.exe" --clobber
